name: mantener-despierto
# Render gratis duerme el bot a los 15 min sin tráfico. Una visita cada 10 min lo mantiene despierto
# (el repo es público, así que los minutos de Actions son gratis). GitHub puede retrasar algún cron.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -m 90 -o /dev/null -w "%{http_code}\n" https://miteslaapp.onrender.com/ || true
