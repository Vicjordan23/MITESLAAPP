services:
  - type: web
    name: miteslaapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m teslabot.bot
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - { key: TELEGRAM_TOKEN, sync: false }
      - { key: TELEGRAM_CHAT_ID, sync: false }
      - { key: ESIOS_TOKEN, sync: false }
      - { key: WEBHOOK_SECRET, sync: false }
      - { key: BATTERY_KWH, value: "60" }
      - { key: CHARGER_KW, value: "7.4" }
      - { key: CONTRACTED_KW, value: "4.4" }
      - { key: HOUSE_KW, value: "1.0" }
      - { key: KWH_PER_100KM, value: "15" }
      # Opcionales (cuando tengas coche/cargador); si no los rellenas, esas funciones quedan desactivadas
      - { key: TESSIE_TOKEN, sync: false }
      - { key: TESSIE_VIN, sync: false }
      - { key: WALLBOX_USER, sync: false }
      - { key: WALLBOX_PASSWORD, sync: false }
      - { key: WALLBOX_ID, sync: false }
